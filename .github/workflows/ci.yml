# ---------------------------------------------------------------
# CI workflow
#
# Runs on every pull request (and on pushes to main) to verify
# that the Docker image builds successfully and passes the full
# integration test suite before merging.
# ---------------------------------------------------------------

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: delta_quickstart:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run integration tests
        run: bash tests/test_docker.sh delta_quickstart:ci
